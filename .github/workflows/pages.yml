# Publishes the landing page (site/) to GitHub Pages whenever it changes on main.
name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'assets/screenshot.jpg', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # (the README picture doubles as the link preview)
      - run: cp assets/screenshot.jpg site/assets/preview.jpg
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
